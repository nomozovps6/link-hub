<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oybek — Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ── CYBERPUNK GRID FON ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .glow.a {
            width: 400px;
            height: 400px;
            background: #00f0ff;
            opacity: 0.12;
            top: -100px;
            right: -50px;
        }
        .glow.b {
            width: 350px;
            height: 350px;
            background: #ff00aa;
            opacity: 0.10;
            bottom: -80px;
            left: -50px;
        }
        .glow.c {
            width: 280px;
            height: 280px;
            background: #8b5cf6;
            opacity: 0.08;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ── ASOSIY KONTEYNER ── */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        /* ── AVATAR ── */
        .avatar-box {
            position: relative;
            padding: 5px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00f0ff, #ff00aa, #8b5cf6);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4), 0 0 50px rgba(255, 0, 170, 0.2);
        }

        .avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #0a0a12;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        /* ── PROFIL MATNLARI ── */
        .info {
            text-align: center;
        }

        .info h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            text-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
        }

        .info p {
            font-size: 15px;
            font-weight: 600;
            color: #00f0ff;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            opacity: 0.85;
            margin-top: 5px;
        }

        /* ── HAVOLALAR RO'YXATI ── */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .link-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 24px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            background: rgba(14, 14, 26, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid transparent;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .link-btn .icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .link-btn .icon svg {
            width: 100%;
            height: 100%;
        }

        /* Tugmalar ranglari */
        .link-btn.telegram {
            border-color: rgba(0, 170, 255, 0.4);
            color: #00d2ff;
        }
        .link-btn.telegram:hover {
            background: rgba(0, 170, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 170, 255, 0.4);
            border-color: #00d2ff;
            transform: translateY(-2px);
        }

        .link-btn.instagram {
            border-color: rgba(255, 0, 170, 0.4);
            color: #ff3dae;
        }
        .link-btn.instagram:hover {
            background: rgba(255, 0, 170, 0.15);
            box-shadow: 0 0 25px rgba(255, 0, 170, 0.4);
            border-color: #ff3dae;
            transform: translateY(-2px);
        }

        .link-btn.linkedin {
            border-color: rgba(0, 240, 255, 0.4);
            color: #00f0ff;
        }
        .link-btn.linkedin:hover {
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            border-color: #00f0ff;
            transform: translateY(-2px);
        }

        .link-btn.portfolio {
            border-color: rgba(139, 92, 246, 0.4);
            color: #b18cfc;
        }
        .link-btn.portfolio:hover {
            background: rgba(139, 92, 246, 0.15);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
            border-color: #b18cfc;
            transform: translateY(-2px);
        }

        .link-btn:active {
            transform: scale(0.98);
        }

        /* ── PASTKI MATN ── */
        .footer {
            margin-top: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(0, 240, 255, 0.3);
            text-transform: uppercase;
        }
    </style>
</head>
